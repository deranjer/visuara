[workspace]
resolver = "2"
members = [
    "visuara-common",
    "visuara-signaling",
    "visuara-agent",
    "visuara-client",
]

[workspace.package]
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
