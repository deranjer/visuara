[package]
name = "visuara-signaling"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
visuara-common = { path = "../visuara-common" }

axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
anyhow = "1"
futures-util = "0.3"

[dev-dependencies]
# default-features off: the test only talks plain http://, and reqwest's
# default TLS backend (rustls+aws-lc-rs) otherwise gets feature-unified into
# every test binary in the workspace, conflicting with webrtc-rs's own
# rustls crypto provider and panicking visuara-client's WebRTC/DTLS test.
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "form"] }
tokio-tungstenite = "0.24"
