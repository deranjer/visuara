[package]
name = "visuara-signaling"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
visuara-common = { path = "../visuara-common" }

axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
anyhow = "1"
futures-util = "0.3"
# default-features off, native-tls (vendored) instead of rustls: reqwest
# 0.13's only rustls option installs aws-lc-rs as the process-wide default
# rustls CryptoProvider, which is exactly the documented conflict that broke
# visuara-client's WebRTC/DTLS test when reqwest's default TLS backend got
# feature-unified into a `cargo test --workspace` build ("Could not
# automatically determine the process-level CryptoProvider" — two ambiguous
# rustls providers linked into one test binary). native-tls-vendored uses
# OpenSSL (vendored, no system package needed, same as this workspace's
# `openh264` codec dependency) and never touches rustls's provider registry
# at all, sidestepping the conflict entirely rather than trying to match
# webrtc-rs's provider choice.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "cookies", "form", "native-tls-vendored"] }
rust-embed = { version = "8", features = ["mime-guess", "compression"] }

[dev-dependencies]
tokio-tungstenite = "0.24"
